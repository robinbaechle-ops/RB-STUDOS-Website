<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/logo/rb-studio-favicon.svg">
  <title>Produkt individualisieren</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="site-nav nav-left">
      <a href="index.html">Start</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="brand-block">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/logo/rb-studio-logo.svg" alt="Studio RB">
      </a>
      <span class="tagline">Lasergravuren nach Maß</span>
    </div>
    <nav class="site-nav nav-right">
      <a href="laser.html" aria-current="page">Laser</a>
      <a href="3d-druck.html">3D Druck</a>
      <a href="impressum.html">Impressum</a>
    </nav>
  </header>

  <main>
    <a class="back-link" href="laser.html">← Zurück zum Katalog</a>

    <p id="not-found" hidden>Dieses Produkt wurde nicht gefunden. <a href="laser.html">Zurück zum Katalog</a></p>

    <div class="product-layout" id="product-layout">
      <section class="preview-panel">
        <canvas id="preview-canvas"></canvas>
        <p class="preview-caption">Live-Vorschau deines Motivs. Für die endgültige Datei wird daraus automatisch die Gravurdatei erzeugt.</p>
      </section>

      <section class="customizer-form">
        <h1 id="product-name"></h1>
        <p class="price" id="product-price"></p>

        <form id="fields" onsubmit="return false;"></form>

        <label class="checkbox-field">
          <input type="checkbox" id="engrave-toggle">
          Gravur-Vorschau (Graustufen)
        </label>

        <div class="actions">
          <button class="btn primary" id="generate-btn" type="button">Vorschau generieren</button>
        </div>
      </section>
    </div>
  </main>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/customizer.js"></script>
</body>
</html>
