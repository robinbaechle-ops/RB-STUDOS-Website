  <title>Contact — Studio RB</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <button class="menu-toggle" id="menu-toggle" aria-label="Menü öffnen" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav nav-left">
      <a href="index.html">Start</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Kontakt</a>
    </nav>
    <div class="brand-block">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/logo/rb-studio-logo.svg" alt="Studio RB">
      </a>
    </div>
    <nav class="site-nav nav-right">
      <a href="laser.html">Laser</a>
      <a href="3d-druck.html">3D Druck</a>
      <a href="impressum.html">Impressum</a>
    </nav>
    <nav class="mobile-nav" id="mobile-nav" hidden>
      <a href="index.html">Start</a>
      <a href="about.html">About</a>
      <a href="contact.html" aria-current="page">Kontakt</a>
      <a href="laser.html">Laser</a>
      <a href="3d-druck.html">3D Druck</a>
      <a href="impressum.html">Impressum</a>
    </nav>
  </header>

  <main class="page">
    <h1>Kontakt</h1>
    <p>Fragen zu einem Motiv, zur Lieferzeit oder ein individueller Wunsch? Schreib uns.</p>

    <form class="contact-form" id="contact-form">
      <div class="form-row">
        <div class="field">
          <label for="first-name">Vorname</label>
          <input type="text" id="first-name" name="firstName" required>
        </div>
        <div class="field">
          <label for="last-name">Nachname</label>
          <input type="text" id="last-name" name="lastName" required>
        </div>
      </div>

      <div class="field">
        <label for="email">E-Mail</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="field">
        <label for="message">Nachricht</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </div>

      <div class="actions">
        <button class="btn primary" type="submit">Nachricht senden</button>
      </div>
    </form>

    <p class="form-status" id="form-status" hidden></p>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="copyright-year"></span> Studio RB. Alle Rechte vorbehalten.</p>
    <a href="impressum.html">Impressum</a>
  </footer>

  <script src="assets/js/contact.js"></script>
  <script src="assets/js/nav.js"></script>
</body>
</html>
